# Master Toggle
ENABLE_MELODY_REDUCER: true

# Melody Extraction Rules
AMBIGUITY_LOOKAHEAD: 2
ENABLE_DYNAMIC_EXCLUSION: true
DYNAMIC_EXCLUSION_LIMIT: 8
LOWER_TENUTO_THRESHOLD: 3
SAFE_MODE_PRESERVE_LOWER: false

# Run Simplification Rules
RUN_MIN_NOTES: 8
RUN_MIN_NOTES_PER_BEAT: 100.0 # effective toggle
RUN_DURATION_TOLERANCE_RATIO: 2.5

# Selection Toggles
RUN_INCLUDE_START_NOTE: false
RUN_INCLUDE_END_NOTE: false
RUN_INCLUDE_ARTICULATED: true
RUN_BOUNDARY_SKIP: -1
RUN_LEAP_THRESHOLD: 99

# Ostinato Config
OSTINATO_ALWAYS_REPLACE: false
OSTINATO_MIN_REPS: 100 # effective toggle
OSTINATO_PROTECTION_MEASURES: 8

# Debug
DEBUG: false